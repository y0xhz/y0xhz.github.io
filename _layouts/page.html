---
layout: default
---
<article class="page-content">
  <header class="page-header">
    <p class="eyebrow">{{ page.kicker | default: 'From the notebook' }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.subtitle %}<p class="page-intro">{{ page.subtitle }}</p>{% endif %}
  </header>
  <div class="page-body">{{ content }}</div>
</article>
